[project]
name = "credit-card-fraud"
version = "1.0.0"
description = "Credit card fraud detection with XGBoost, a training pipeline and an agent-style CLI"
authors = [
    { name = "Viral Mistry", email = "viralmistry240@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "typer>=0.27.3",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
]

[tool.uv]
package = false
